# ForensiQ Pre-Commit Configuration
# See https://pre-commit.com for more information

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff Linter (Auto-Fix)
        entry: uv run ruff check --fix
        language: system
        types: [python]
        exclude: migrations/

      - id: ruff-format
        name: Ruff Formatter
        entry: uv run ruff format
        language: system
        types: [python]
        exclude: migrations/

      - id: forensiq-validator
        name: ForensiQ Quality, Django & Doc Validator
        entry: uv run python scripts/validate_project.py
        language: system
        pass_filenames: false
        always_run: true



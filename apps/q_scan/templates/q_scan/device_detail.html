<c-base title="Q-Scan | Endpoint Audit: {{ device.hostname }}">

    <!-- Page Header with Back Link -->
    <c-page_header 
        title="{{ device.hostname }}" 
        subtitle="Forensic evidence breakdown for {{ device.scan_title|default:'Endpoint Investigation' }}." 
        icon="fa-solid fa-desktop"
        icon_color="text-teal-400"
        back_url="/scan/">
        
        <div class="flex items-center gap-2">
            <a href="{% url 'q_scan:export_csv' %}?device_id={{ device.id }}" 
               class="inline-flex items-center gap-2 px-4 py-2 rounded-xl bg-teal-600 hover:bg-teal-500 text-white text-xs font-bold shadow-lg shadow-teal-600/20 transition-all">
                <i class="fa-solid fa-file-export"></i>
                <span>Export Device Hits (CSV)</span>
            </a>
        </div>
    </c-page_header>

    <!-- Device Overview Card -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">
        <c-stat_card 
            title="Host Machine" 
            value="{{ device.hostname }}" 
            subtitle="Custodian: {{ device.custodian_name|default:'Unassigned' }}" 
            icon="fa-solid fa-laptop-code" 
            variant="slate" />

        <c-stat_card 
            title="Total Evidence Hits" 
            value="{{ total_hits }}" 
            subtitle="Matched Keyword Findings" 
            icon="fa-solid fa-magnifying-glass" 
            variant="teal" />

        <c-stat_card 
            title="Drive Letter" 
            value="{{ device.drive_letter|default:'C:\\' }}" 
            subtitle="File System: {{ device.file_system|default:'NTFS' }}" 
            icon="fa-solid fa-hard-drive" 
            variant="amber" />

        <c-stat_card 
            title="Audit Status" 
            value="{{ device.status }}" 
            subtitle="Imported {{ device.created_at|date:'Y-m-d' }}" 
            icon="fa-solid fa-shield-check" 
            variant="emerald" />
    </div>

    <!-- Evidence Hits Table -->
    <c-card title="Evidence Findings for {{ device.hostname }}" subtitle="Granular list of matched keywords, file paths, and context snippets." icon="fa-solid fa-file-shield" icon_color="text-teal-400">
        <div class="mb-4 flex flex-wrap items-center gap-3">
            <c-search_bar 
                id="device-search" 
                threshold_id="device-search-threshold" 
                placeholder="Search filenames, keywords, snippets..." 
                threshold="75" />


            <button id="device-clear-filter" class="px-3 py-1.5 text-xs rounded-xl bg-zinc-800 hover:bg-zinc-700 text-zinc-300 border border-zinc-700 transition-colors cursor-pointer">
                Reset Filter
            </button>
        </div>

        <div id="device-hits-table" class="min-h-[420px] rounded-xl overflow-hidden border border-slate-200 dark:border-zinc-800"></div>
    </c-card>

    <script>
        let table = null;
        let debounceTimer = null;

        function applyFilters() {
            if (table) table.setData();
        }

        function resetFilters() {
            const searchInput = document.getElementById("device-search");
            const thresholdInput = document.getElementById("device-search-threshold");
            if (searchInput) searchInput.value = "";
            if (thresholdInput) {
                thresholdInput.value = 75;
                thresholdInput.dispatchEvent(new Event('input', { bubbles: true }));
            }
            applyFilters();
        }

        function copyPath(event, text, label) {
            if (event) {
                event.stopPropagation();
                event.preventDefault();
            }
            if (!text) return;

            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(() => {
                    showToast(`Copied ${label}: ${text}`);
                }).catch(() => {
                    fallbackCopy(text, label);
                });
            } else {
                fallbackCopy(text, label);
            }
        }

        function fallbackCopy(text, label) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            textArea.style.left = "-999999px";
            textArea.style.top = "-999999px";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try {
                document.execCommand('copy');
                showToast(`Copied ${label}: ${text}`);
            } catch (err) {
                console.error('Fallback copy failed', err);
            }
            document.body.removeChild(textArea);
        }

        function showToast(message) {
            let container = document.getElementById("toast-container");
            if (!container) {
                container = document.createElement("div");
                container.id = "toast-container";
                container.className = "fixed bottom-6 right-6 z-50 flex flex-col gap-2 max-w-lg pointer-events-none";
                document.body.appendChild(container);
            }

            const toast = document.createElement("div");
            toast.className = "flex items-center gap-2.5 px-4 py-3 rounded-xl bg-zinc-900/95 border border-teal-500/40 text-white shadow-2xl shadow-teal-500/10 text-xs font-mono transform translate-y-2 opacity-0 transition-all duration-300 pointer-events-auto backdrop-blur-md";
            
            const icon = document.createElement("i");
            icon.className = "fa-solid fa-circle-check text-emerald-400 text-sm shrink-0";
            
            const textEl = document.createElement("div");
            textEl.className = "truncate flex-1 font-sans text-xs text-zinc-200";
            textEl.textContent = message;

            toast.appendChild(icon);
            toast.appendChild(textEl);
            container.appendChild(toast);

            requestAnimationFrame(() => {
                toast.classList.remove("translate-y-2", "opacity-0");
            });

            setTimeout(() => {
                toast.classList.add("opacity-0", "translate-y-2");
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        document.addEventListener('DOMContentLoaded', function () {
            table = new Tabulator("#device-hits-table", {
                ajaxURL: "{% url 'q_scan:hits_api' %}",
                ajaxConfig: "GET",
                ajaxParams: function () {
                    return {
                        device_id: "{{ device.id }}",
                        search: document.getElementById("device-search")?.value || "",
                        threshold: document.getElementById("device-search-threshold")?.value || 75,
                    };
                },
                pagination: true,
                paginationMode: "remote",
                paginationSize: 25,
                paginationSizeSelector: [25, 50, 100, 250],
                sortMode: "remote",
                layout: "fitColumns",
                responsiveLayout: "collapse",
                placeholder: "No evidence hits found matching current criteria",
                initialSort: [{ column: "risk_score", dir: "desc" }],
                columns: [
                    {
                        title: "Risk",
                        field: "risk_score",
                        width: 80,
                        headerSort: true,
                        formatter: function (cell) {
                            const val = cell.getValue();
                            let badgeClass = "bg-slate-500/10 text-slate-400 border-slate-500/20";
                            if (val >= 70) badgeClass = "bg-rose-500/10 text-rose-400 border-rose-500/30";
                            else if (val >= 40) badgeClass = "bg-amber-500/10 text-amber-400 border-amber-500/30";
                            return `<span class="px-2 py-0.5 rounded text-[11px] font-mono font-bold border ${badgeClass}">${val}</span>`;
                        }
                    },
                    {
                        title: "Keyword",
                        field: "matched_keyword",
                        width: 130,
                        headerSort: true,
                        formatter: function (cell) {
                            return `<span class="px-2 py-0.5 rounded-full text-[11px] font-mono font-bold bg-teal-500/15 text-teal-400 border border-teal-500/30">${cell.getValue()}</span>`;
                        }
                    },
                    {
                        title: "Match Type",
                        field: "match_type_label",
                        width: 135,
                        headerSort: false,
                        formatter: function (cell) {
                            return `<span class="text-[11px] font-mono text-slate-400">${cell.getValue()}</span>`;
                        }
                    },
                    {
                        title: "Filename & Location",
                        field: "filename",
                        minWidth: 240,
                        headerSort: true,
                        formatter: function (cell) {
                            const data = cell.getRow().getData();
                            const folder = data.folder_path || "";
                            const fullPath = data.file_path || "";
                            return `
                                <div class="py-0.5">
                                    <div class="font-mono text-xs text-slate-800 dark:text-zinc-200 font-semibold truncate" title="${fullPath.replace(/"/g, '&quot;')}">
                                        ${cell.getValue()}
                                    </div>
                                    <div class="font-mono text-[10px] text-slate-400 dark:text-zinc-500 truncate flex items-center gap-1 mt-0.5" title="${folder.replace(/"/g, '&quot;')}">
                                        <i class="fa-solid fa-folder text-amber-400/80 text-[9px] shrink-0"></i>
                                        <span class="truncate">${folder || '-'}</span>
                                    </div>
                                </div>
                            `;
                        }
                    },
                    {
                        title: "Copy Path",
                        field: "folder_path",
                        width: 140,
                        hozAlign: "center",
                        headerSort: false,
                        formatter: function (cell) {
                            const data = cell.getRow().getData();
                            const safeFolder = encodeURIComponent(data.folder_path || "");
                            const safeFile = encodeURIComponent(data.file_path || "");
                            return `
                                <div class="flex items-center justify-center gap-1.5">
                                    <button onclick="copyPath(event, decodeURIComponent('${safeFolder}'), 'Folder Path')" 
                                            class="inline-flex items-center gap-1 px-2 py-1 rounded-lg bg-teal-500/10 hover:bg-teal-500/20 text-teal-400 hover:text-teal-300 text-[10px] font-semibold border border-teal-500/25 transition-all cursor-pointer shadow-sm" 
                                            title="Copy Folder Path: ${data.folder_path?.replace(/"/g, '&quot;')}">
                                        <i class="fa-solid fa-folder text-[10px] text-amber-400"></i>
                                        <span>Folder</span>
                                    </button>
                                    <button onclick="copyPath(event, decodeURIComponent('${safeFile}'), 'File Path')" 
                                            class="inline-flex items-center gap-1 px-2 py-1 rounded-lg bg-zinc-800 hover:bg-zinc-700 text-zinc-300 text-[10px] font-semibold border border-zinc-700 transition-all cursor-pointer" 
                                            title="Copy Full File Path: ${data.file_path?.replace(/"/g, '&quot;')}">
                                        <i class="fa-regular fa-copy text-[10px]"></i>
                                        <span>File</span>
                                    </button>
                                </div>
                            `;
                        }
                    },
                    {
                        title: "Size",
                        field: "file_size_display",
                        width: 90,
                        headerSort: true
                    },
                    {
                        title: "Context Snippet",
                        field: "snippet",
                        headerSort: false,
                        formatter: function (cell) {
                            const snippet = cell.getValue();
                            if (!snippet || snippet === "-") return `<span class="text-slate-500 font-mono text-[11px]">-</span>`;
                            return `<span class="text-[11px] font-mono text-slate-600 dark:text-zinc-400 truncate block" title="${snippet.replace(/"/g, '&quot;')}">${snippet}</span>`;
                        }
                    },
                    {
                        title: "Modified Date",
                        field: "file_modified_at",
                        width: 130,
                        headerSort: true,
                        formatter: function (cell) {
                            return `<span class="text-[11px] font-mono text-slate-400">${cell.getValue()}</span>`;
                        }
                    }
                ]
            });


            const triggerSearch = function () {
                clearTimeout(debounceTimer);
                debounceTimer = setTimeout(applyFilters, 300);
            };
            document.getElementById("device-search")?.addEventListener("input", triggerSearch);
            document.getElementById("device-search-threshold")?.addEventListener("input", triggerSearch);
            document.getElementById("device-search-threshold")?.addEventListener("change", triggerSearch);

            document.getElementById("device-clear-filter")?.addEventListener("click", function () {
                resetFilters();
            });
        });
    </script>
</c-base>

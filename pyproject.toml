[project]
name = "forensi-q"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "vikashgraja", email = "vikashgraja@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "defusedxml>=0.7.1",
    "django>=6.1.1",
    "django-cotton>=2.7.2",
    "libpff-python-windows>=20231205; sys_platform == 'win32'",
    "loguru>=0.7.3",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "pillow>=12.3.0",
    "plotly>=7.1.0",
    "pypdf>=6.19.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.3",
    "rapidfuzz>=3.14.6",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "coverage>=7.16.1",
    "django-debug-toolbar>=8.0.0",
    "django-upgrade>=1.32.0",
    "djlint>=1.46.2",
    "pre-commit>=4.6.2",
    "ruff>=0.16.9",
]
prod = [
    "gunicorn>=26.2.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = [
    ".venv",
    "staticfiles",
    "node_modules",
    "migrations",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "DJ",  # flake8-django rules
]
ignore = [
    "E501",  # line length handled by ruff format
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.bandit]
exclude_dirs = [".venv", "staticfiles", "node_modules", "tests", "scratch"]
skips = ["B101"]

[tool.coverage.run]
source = ["apps", "core"]
omit = [
    "*/migrations/*",
    "*/tests.py",
    "*/tests/*",
    "core/runner.py",
    "manage.py",
    "ForensiQ/wsgi.py",
    "ForensiQ/asgi.py",
]
branch = false

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 1
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.coverage.html]
directory = "htmlcov"

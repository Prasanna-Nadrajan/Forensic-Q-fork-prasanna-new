<c-vars
    title="Multi-Hop Fund Flow Topology"
    subtitle="Direct transfers and 1-hop pass-through conduits with cycle-closing return arcs."
/>

<div class="bg-white dark:bg-zinc-950 text-slate-900 dark:text-white rounded-xl p-5 border border-slate-200 dark:border-zinc-800 shadow-md mb-8 relative overflow-hidden"
     x-data="{
         graph: window.topologyGraphData || { W: 1060, H: 580, R: 18, nodes: [], edges: [], plates: [], cols: [] },
         focusedNode: null,
         focusedEdge: null,
         hoveredNode: null,
         hoveredEdge: null,
         activeBeatEdge: null,
         tooltip: null,

         init() {
             this.renderSvg();
             this.$watch('focusedNode', () => this.renderSvg());
             this.$watch('focusedEdge', () => this.renderSvg());
             this.$watch('hoveredNode', () => this.renderSvg());
             this.$watch('hoveredEdge', () => this.renderSvg());
             this.$watch('activeBeatEdge', () => this.renderSvg());
         },

         isEdgeActive(edgeId) {
             if (this.activeBeatEdge) return this.activeBeatEdge === edgeId;
             if (this.focusedEdge) return this.focusedEdge === edgeId;
             if (this.hoveredEdge) return this.hoveredEdge === edgeId;
             if (this.focusedNode) {
                 const e = this.graph.edges.find(x => x.id === edgeId);
                 return e && (e.from === this.focusedNode || e.to === this.focusedNode);
             }
             if (this.hoveredNode) {
                 const e = this.graph.edges.find(x => x.id === edgeId);
                 return e && (e.from === this.hoveredNode || e.to === this.hoveredNode);
             }
             return true;
         },

         isNodeActive(nodeId) {
             if (this.focusedNode) return this.focusedNode === nodeId;
             if (this.hoveredNode) return this.hoveredNode === nodeId;
             if (this.activeBeatEdge) {
                 const e = this.graph.edges.find(x => x.id === this.activeBeatEdge);
                 return e && (e.from === nodeId || e.to === nodeId);
             }
             if (this.focusedEdge) {
                 const e = this.graph.edges.find(x => x.id === this.focusedEdge);
                 return e && (e.from === nodeId || e.to === nodeId);
             }
             if (this.hoveredEdge) {
                 const e = this.graph.edges.find(x => x.id === this.hoveredEdge);
                 return e && (e.from === nodeId || e.to === nodeId);
             }
             return true;
         },

         get isFocused() {
             return !!(this.focusedNode || this.focusedEdge || this.hoveredNode || this.hoveredEdge || this.activeBeatEdge);
         },

         selectNode(id) {
             this.focusedNode = (this.focusedNode === id) ? null : id;
             this.focusedEdge = null;
         },

         selectEdge(id) {
             this.focusedEdge = (this.focusedEdge === id) ? null : id;
             this.focusedNode = null;
         },

         clearFocus() {
             this.focusedNode = null;
             this.focusedEdge = null;
             this.activeBeatEdge = null;
         },

         renderSvg() {
             const container = this.$refs.svgDynamics;
             if (!container || !this.graph) return;
             const g = this.graph;
             let html = '';

             // 1. Column Guides
             (g.cols || []).forEach(col => {
                 html += `<line x1='${col.x}' y1='60' x2='${col.x}' y2='${g.H - 40}' class='stroke-slate-200 dark:stroke-zinc-800' stroke-width='1' stroke-dasharray='3 6' />`;
                 html += `<text x='${col.x}' y='42' text-anchor='middle' class='fill-slate-500 dark:fill-zinc-500' font-size='10' font-family='monospace' font-weight='700' letter-spacing='1.5'>${col.t}</text>`;
             });

             // 2. Edges
             (g.edges || []).forEach(e => {
                 const on = this.isEdgeActive(e.id);
                 const op = this.isFocused ? (on ? 1 : 0.08) : 0.85;
                 const marker = (e.kind === 'direct') ? 'arw-direct' : ((e.kind === 'return') ? 'arw-return' : 'arw-hop');
                 const dash = e.dashed ? `stroke-dasharray='4 4'` : '';
                 const sw = (e.kind === 'return') ? 2.5 : 1.8;

                 html += `<g opacity='${op}' style='transition: opacity .2s'>`;
                 if (e.kind === 'return' || on) {
                     html += `<path d='${e.d}' fill='none' stroke='${e.color}' stroke-width='6' stroke-linecap='round' opacity='0.2' />`;
                 }
                 html += `<path d='${e.d}' fill='none' stroke='${e.color}' stroke-width='${sw}' stroke-linecap='round' ${dash} marker-end='url(#${marker})' />`;
                 html += `<path d='${e.d}' fill='none' stroke='transparent' stroke-width='16' style='cursor:pointer' data-edge-id='${e.id}' />`;
                 html += `</g>`;
             });

             // 3. Connection Docking Pins on SVG layer
             (g.nodes || []).forEach(n => {
                 const on = this.isNodeActive(n.id);
                 const op = this.isFocused ? (on ? 1 : 0.2) : 0.8;
                 const fill = (n.kind === 'conduit') ? '#38bdf8' : '#f59e0b';
                 const halfW = (n.w || 205) / 2;

                 html += `<g opacity='${op}' style='transition: opacity .2s' data-node-id='${n.id}'>`;
                 // Left dock pin (incoming)
                 if (n.kind === 'conduit' || n.x > 500) {
                     html += `<circle cx='${n.x - halfW}' cy='${n.y}' r='3.5' fill='${fill}' class='stroke-white dark:stroke-zinc-950' stroke-width='1.5' />`;
                 }
                 // Right dock pin (outgoing)
                 if (n.kind === 'conduit' || n.x < 500) {
                     html += `<circle cx='${n.x + halfW}' cy='${n.y}' r='3.5' fill='${fill}' class='stroke-white dark:stroke-zinc-950' stroke-width='1.5' />`;
                 }
                 html += `</g>`;
             });

             container.innerHTML = html;
         }
     }"
     @beat-changed.window="
         activeBeatEdge = $event.detail.beat ? $event.detail.beat.edge_id : null;
     ">

    <!-- Topology Header & Legend Bar -->
    <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-4 border-b border-slate-200 dark:border-zinc-800 pb-4 mb-4">
        <div>
            <div class="flex items-center gap-2">
                <span class="w-7 h-7 rounded-lg bg-amber-500/10 text-amber-500 flex items-center justify-center text-xs">
                    <i class="fa-solid fa-diagram-project"></i>
                </span>
                <h3 class="font-bold text-sm sm:text-base text-slate-900 dark:text-white">
                    {{ title }}
                </h3>
                <span class="text-xs font-mono px-2 py-0.5 rounded bg-slate-200 dark:bg-zinc-800 text-slate-500 dark:text-zinc-400"
                      x-text="(graph.edges || []).length + ' Links · ' + (graph.nodes || []).length + ' Entities'"></span>
            </div>
            <p class="text-xs text-slate-500 dark:text-zinc-400 mt-1">
                {{ subtitle }}
            </p>
        </div>

        <!-- Legend -->
        <div class="flex flex-wrap items-center gap-3 text-[11px] font-mono select-none">
            <span class="flex items-center gap-1.5">
                <span class="w-3.5 h-0.5 bg-emerald-400 rounded"></span>
                <span class="text-slate-600 dark:text-zinc-300">Rule 1 Direct</span>
            </span>
            <span class="flex items-center gap-1.5">
                <span class="w-3.5 h-0.5 bg-sky-400 rounded"></span>
                <span class="text-slate-600 dark:text-zinc-300">Rule 2 Conduit</span>
            </span>
            <span class="flex items-center gap-1.5">
                <span class="w-3.5 h-0.5 bg-rose-500 border-b border-dashed border-rose-400"></span>
                <span class="text-slate-600 dark:text-zinc-300">Loop Return</span>
            </span>
            <span class="flex items-center gap-1.5">
                <span class="w-2.5 h-2.5 rounded-full bg-amber-400"></span>
                <span class="text-slate-600 dark:text-zinc-300">Auditee</span>
            </span>
            <span class="flex items-center gap-1.5">
                <span class="w-2.5 h-2.5 rounded-full border border-dashed border-sky-400"></span>
                <span class="text-slate-600 dark:text-zinc-300">Conduit</span>
            </span>
            <template x-if="isFocused">
                <button type="button" @click="clearFocus()"
                        class="px-2 py-0.5 rounded bg-slate-200 dark:bg-zinc-800 hover:bg-slate-300 dark:bg-zinc-700 text-slate-600 dark:text-zinc-300 text-[10px] font-bold cursor-pointer">
                    <i class="fa-solid fa-xmark mr-1"></i>Reset Focus
                </button>
            </template>
        </div>
    </div>

    <!-- Dual-Layer Canvas Container (SVG edges + HTML node plates) -->
    <div class="relative w-full overflow-hidden rounded-xl border border-slate-200 dark:border-zinc-800/80 bg-white dark:bg-zinc-950 select-none"
         :style="'aspect-ratio: ' + (graph.W || 1060) + ' / ' + (graph.H || 580) + ';'">

        <!-- 1. SVG Layer (Grid, column guides, vector curves, arrows, node circles) -->
        <svg class="w-full h-full absolute inset-0"
             :viewBox="'0 0 ' + (graph.W || 1060) + ' ' + (graph.H || 580)"
             preserveAspectRatio="xMidYMid meet"
             @mouseover="
                 const nodeEl = $event.target.closest('[data-node-id]');
                 const edgeEl = $event.target.closest('[data-edge-id]');
                 if (nodeEl) {
                     hoveredNode = nodeEl.getAttribute('data-node-id');
                 } else if (edgeEl) {
                     const edgeId = edgeEl.getAttribute('data-edge-id');
                     hoveredEdge = edgeId;
                     const e = (graph.edges || []).find(x => x.id === edgeId);
                     if (e && e.mid) tooltip = { title: (e.from_name || '') + ' → ' + (e.to_name || ''), amount: e.amount || '', kind: e.kind || '', utr: e.utr || '', x: e.mid.x, y: e.mid.y };
                 }
             "
             @mouseout="
                 if (!$event.relatedTarget || !$event.relatedTarget.closest('[data-node-id]')) hoveredNode = null;
                 if (!$event.relatedTarget || !$event.relatedTarget.closest('[data-edge-id]')) { hoveredEdge = null; tooltip = null; }
             "
             @click="
                 const nodeEl = $event.target.closest('[data-node-id]');
                 const edgeEl = $event.target.closest('[data-edge-id]');
                 if (nodeEl) selectNode(nodeEl.getAttribute('data-node-id'));
                 else if (edgeEl) selectEdge(edgeEl.getAttribute('data-edge-id'));
             ">
            <defs>
                <!-- Subtle dotted grid -->
                <pattern id="qtrailGrid" width="24" height="24" patternUnits="userSpaceOnUse">
                    <circle cx="1" cy="1" r="1" class="fill-slate-300 dark:fill-zinc-800" />
                </pattern>

                <!-- Arrow markers -->
                <marker id="arw-direct" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#10b981" />
                </marker>
                <marker id="arw-hop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#38bdf8" />
                </marker>
                <marker id="arw-return" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#ef4444" />
                </marker>
            </defs>

            <!-- Background & Grid -->
            <rect width="100%" height="100%" class="fill-white dark:fill-zinc-950" />
            <rect width="100%" height="100%" fill="url(#qtrailGrid)" />

            <!-- Dynamic SVG Elements Container -->
            <g x-ref="svgDynamics"></g>
        </svg>

        <!-- 2. HTML Layer (Integrated Node Cards with Embedded Avatar) -->
        <div class="absolute inset-0 pointer-events-none">
            <template x-for="p in (graph.plates || [])" :key="p.id">
                <div class="absolute pointer-events-auto transition-all duration-200"
                     :style="'left: ' + ((p.x / (graph.W || 1060)) * 100) + '%; top: ' + ((p.y / (graph.H || 580)) * 100) + '%; width: ' + ((p.w / (graph.W || 1060)) * 100) + '%; height: ' + ((p.h / (graph.H || 580)) * 100) + '%;'"
                     :class="isFocused ? (isNodeActive(p.id) ? 'opacity-100 scale-[1.02] z-10' : 'opacity-20') : 'opacity-100'">
                    <button type="button" @click="selectNode(p.id)"
                            @mouseenter="hoveredNode = p.id" @mouseleave="hoveredNode = null"
                            class="w-full h-full px-2.5 py-1.5 rounded-lg border text-left flex items-center gap-2.5 transition shadow-sm cursor-pointer overflow-hidden group select-none"
                            :class="(p.meta && p.meta.kind === 'conduit')
                                ? 'bg-sky-50 dark:bg-sky-950/85 hover:bg-sky-100 dark:hover:bg-sky-900/90 border-sky-300 dark:border-sky-500/40 hover:border-sky-500 dark:hover:border-sky-400 text-sky-800 dark:text-sky-200'
                                : 'bg-slate-50 dark:bg-zinc-900/90 hover:bg-slate-100 dark:hover:bg-zinc-800 border-slate-300 dark:border-zinc-700/80 hover:border-amber-500/60 text-slate-800 dark:text-zinc-200'">

                        <!-- Left: Circular Letter Avatar Badge -->
                        <div class="w-8 h-8 rounded-full flex items-center justify-center font-bold text-xs shrink-0 select-none shadow"
                             :class="(p.meta && p.meta.kind === 'conduit')
                                 ? 'bg-sky-500/20 border border-sky-400 text-sky-300 ring-2 ring-sky-500/20'
                                 : 'bg-amber-500/20 border border-amber-400 text-amber-300 ring-2 ring-amber-500/20'">
                            <span x-text="p.meta ? p.meta.letter : (p.name ? p.name[0].toUpperCase() : 'N')"></span>
                        </div>

                        <!-- Right: Profile Info -->
                        <div class="flex-1 min-w-0 flex flex-col justify-center leading-tight">
                            <span class="font-bold text-xs truncate text-slate-900 dark:text-white block tracking-tight"
                                  x-text="p.meta ? p.meta.label : p.name"></span>
                            <div class="flex items-center justify-between text-[10px] text-slate-500 dark:text-zinc-400 font-mono gap-1 mt-0.5">
                                <span class="truncate text-slate-500 dark:text-zinc-400" x-text="p.meta ? p.meta.sub : ''"></span>
                                <span class="shrink-0 font-medium text-[9px]"
                                      :class="(p.meta && p.meta.kind === 'conduit') ? 'text-sky-400' : 'text-emerald-400'"
                                      x-text="p.meta ? p.meta.foot : ''"></span>
                            </div>
                        </div>
                    </button>
                </div>
            </template>
        </div>

        <!-- 3. Tooltip Popup -->
        <template x-if="tooltip">
            <div class="absolute z-20 pointer-events-none px-2.5 py-1.5 rounded-lg bg-slate-50 dark:bg-zinc-900/95 border border-slate-300 dark:border-zinc-700 text-xs shadow-xl text-slate-900 dark:text-white transform -translate-x-1/2 -translate-y-full mb-2 font-mono"
                 :style="'left: ' + ((tooltip.x / (graph.W || 1060)) * 100) + '%; top: ' + ((tooltip.y / (graph.H || 580)) * 100) + '%;'">
                <div class="text-[10px] text-amber-400 font-bold uppercase tracking-wider" x-text="tooltip.kind"></div>
                <div class="font-bold text-xs" x-text="tooltip.title"></div>
                <div class="text-emerald-400 font-bold" x-text="tooltip.amount"></div>
                <template x-if="tooltip.utr">
                    <div class="text-[10px] text-slate-500 dark:text-zinc-400" x-text="'UTR: ' + tooltip.utr"></div>
                </template>
            </div>
        </template>
    </div>
</div>

{% load static %}
<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ForensiQ | Secure Authorization</title>

    <!-- Favicon (Magnifying Glass) -->
    <link rel="icon" type="image/svg+xml" href="{% static 'core/images/favicon.svg' %}">
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'core/images/favicon-32x32.png' %}">
    <link rel="icon" type="image/png" sizes="64x64" href="{% static 'core/images/favicon.png' %}">
    <link rel="shortcut icon" href="{% static 'core/images/favicon.ico' %}">

    <!-- Theme Initialization & Mode Manager (Prevents FOUC) -->
    <script src="{% static 'ui/js/theme-manager.js' %}"></script>

    <!-- Google Fonts: Inter & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Tailwind CSS + Centralized Theme Configuration -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="{% static 'ui/js/tailwind-theme.js' %}"></script>

    <!-- ForensiQ Centralized Design Tokens & Stylesheet -->
    <link rel="stylesheet" href="{% static 'ui/css/theme.css' %}">
</head>

<body
    class="bg-slate-900 dark:bg-zinc-950 text-slate-900 dark:text-zinc-100 min-h-screen flex flex-col justify-between transition-colors duration-200 selection:bg-amber-500 selection:text-zinc-950 relative overflow-x-hidden">

    <!-- Live Wallpaper Video Background (Vivid HUD Elements) -->
    <div class="fixed inset-0 w-full h-full overflow-hidden pointer-events-none z-0">
        <video class="absolute inset-0 w-full h-full object-cover opacity-80 filter brightness-100 contrast-110"
            autoplay loop muted playsinline>
            <source src="{% static 'core/videos/hud-elements.mp4' %}" type="video/mp4">
        </video>
        <!-- Balanced Vignette to Keep Center Card Crystal Clear -->
        <div
            class="absolute inset-0 bg-[radial-gradient(ellipse_at_center,_rgba(9,9,11,0.5)_0%,_rgba(9,9,11,0.15)_45%,_rgba(9,9,11,0.75)_100%)]">
        </div>
    </div>

    <!-- Top Bar with Logo & Theme Toggle -->
    <header class="relative z-10 w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 flex items-center justify-between">
        <div class="flex items-center">
            <span
                class="font-sans text-xs sm:text-sm font-bold tracking-wider text-white/80 drop-shadow-sm select-none leading-tight">
                HYUNDAI MOTOR INDIA LIMITED<br>AUDIT-PLANT
            </span>
        </div>

        <!-- Theme Toggle -->
        <button id="theme-toggle" type="button" aria-label="Toggle Dark Mode"
            class="w-9 h-9 rounded-lg flex items-center justify-center text-zinc-300 hover:bg-white/10 border border-white/20 bg-white/5 transition backdrop-blur-md shadow-sm">
            <i id="theme-toggle-dark-icon" class="hidden fa-solid fa-moon text-sm text-sky-400"></i>
            <i id="theme-toggle-light-icon" class="hidden fa-solid fa-sun text-sm text-amber-400"></i>
        </button>
    </header>

    <!-- Main Login Card Container -->
    <main class="relative z-10 flex-1 flex items-center justify-center px-4 py-8 sm:px-6 lg:px-8">
        <div class="w-full max-w-md">

            <!-- Card Container -->
            <div
                class="bg-zinc-900/90 border border-zinc-800/80 rounded-2xl shadow-2xl shadow-black/80 p-7 sm:p-9 backdrop-blur-xl relative">

                <!-- Glowing Border Accent -->
                <div
                    class="absolute -top-px left-1/2 -translate-x-1/2 w-3/4 h-px bg-gradient-to-r from-transparent via-amber-500/60 to-transparent">
                </div>

                <!-- Header Content -->
                <div class="text-center mb-8">
                    <h1
                        class="text-4xl font-black tracking-tight text-white flex items-center justify-center select-none leading-none">
                        <span>Forensi</span>
                        <img src="{% static 'core/images/letter_q_orange.png' %}" alt="Q"
                            class="inline-block h-[1.18em] w-auto ml-[0.05em] translate-y-[0.08em] filter drop-shadow-[0_2px_8px_rgba(245,158,11,0.4)]">
                    </h1>
                    <p class="text-sm text-zinc-300/90 mt-2 max-w-xs mx-auto leading-relaxed">
                        In House developed Audit Forensic Ecosystem.
                    </p>
                    <div
                        class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-amber-500/10 border border-amber-500/20 text-amber-400 my-4 shadow-inner">
                        <i class="fa-solid fa-shield-halved text-2xl"></i>
                    </div>
                    <div>
                        <span
                            class="inline-block px-2.5 py-0.5 rounded-full text-[11px] font-bold tracking-wider uppercase bg-amber-950/60 text-amber-400 border border-amber-800/40">
                            Authorized Personnel Only
                        </span>
                    </div>
                </div>

                <!-- Error Alert -->
                {% if error %}
                <div
                    class="mb-6 p-3.5 rounded-xl bg-rose-950/60 border border-rose-800/60 flex items-start space-x-3 text-rose-300 text-xs">
                    <i class="fa-solid fa-circle-exclamation text-rose-400 text-sm mt-0.5 flex-shrink-0"></i>
                    <div class="flex-1 font-medium leading-relaxed">{{ error }}</div>
                </div>
                {% endif %}

                <!-- Login Form -->
                <form method="POST" action="{% url 'portal_login' %}" class="space-y-5">
                    {% csrf_token %}
                    <input type="hidden" name="next" value="{{ next }}">

                    <!-- Password Field -->
                    <div>
                        <div class="relative rounded-xl shadow-sm">
                            <div
                                class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-zinc-400">
                                <i class="fa-solid fa-key text-xs"></i>
                            </div>

                            <input type="password" name="password" id="portal-password" required autofocus
                                placeholder="Enter Security Key..."
                                class="w-full pl-10 pr-11 py-2.5 text-sm rounded-xl border border-zinc-700/80 bg-zinc-950/90 text-white placeholder-zinc-500 focus:outline-none focus:ring-2 focus:ring-amber-500/60 focus:border-amber-500 font-mono transition">

                            <!-- Show / Hide Password Button -->
                            <button type="button" id="btn-toggle-password" tabindex="-1"
                                class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-zinc-400 hover:text-zinc-200 transition">
                                <i id="eye-icon" class="fa-solid fa-eye text-xs"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" id="btn-submit"
                        class="w-full py-2.5 px-4 rounded-xl bg-gradient-to-r from-amber-500 to-amber-450 hover:from-amber-450 hover:to-amber-500 text-zinc-950 font-bold text-xs shadow-lg shadow-amber-500/20 hover:shadow-amber-500/30 transition transform active:scale-[0.99] flex items-center justify-center space-x-2 cursor-pointer">
                        <i class="fa-solid fa-shield-check text-xs"></i>
                        <span>Authorize Session</span>
                        <i class="fa-solid fa-arrow-right text-[10px] ml-1"></i>
                    </button>
                </form>

            </div>

            <!-- Security Footer Note -->
            <div
                class="mt-6 flex items-center justify-center space-x-4 text-[11px] text-zinc-300/80 font-medium drop-shadow-sm">
                <span class="flex items-center"><i class="fa-solid fa-lock text-[10px] mr-1 text-emerald-400"></i>
                    Encrypted Audit Vault</span>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="relative z-10 w-full py-4 text-center text-xs text-zinc-400/90 font-medium drop-shadow-sm">
        ForensiQ &bull; Audit Forensic Investigation Platform
    </footer>

    <!-- Scripts -->
    <script>
        // Password Visibility Toggle
        const passwordInput = document.getElementById('portal-password');
        const toggleBtn = document.getElementById('btn-toggle-password');
        const eyeIcon = document.getElementById('eye-icon');

        if (toggleBtn && passwordInput && eyeIcon) {
            toggleBtn.addEventListener('click', function () {
                if (passwordInput.type === 'password') {
                    passwordInput.type = 'text';
                    eyeIcon.classList.remove('fa-eye');
                    eyeIcon.classList.add('fa-eye-slash');
                } else {
                    passwordInput.type = 'password';
                    eyeIcon.classList.remove('fa-eye-slash');
                    eyeIcon.classList.add('fa-eye');
                }
            });
        }
    </script>
</body>

</html>
